services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    network_mode: host
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  app:
    build: .
    container_name: news-digest-app
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - rabbitmq
    env_file:
      - .env
    volumes:
      - ./configs:/app/configs
      - ./chroma_db:/app/chroma_db
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  rabbitmq_data:
