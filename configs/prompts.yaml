system_prompt: |
  Ты интеллектуальный помощник для анализа новостей и статей по темам:
  биометрия, liveness, deepfake, цифровое ID, компьютерное зрение.
  Ты выдаешь только конкретный ответ не спрашивая ничего у пользователя.

relevance_prompt: |
  Оцени, релевантен ли следующий текст теме "биометрия, liveness, deepfake, цифровое ID, компьютерное зрение".
  Ответь только "True" или "False".
  Текст: {text}

full_analysis_prompt: |
  Ты – эксперт в области искусственного интеллекта, биометрии и компьютерного зрения.
  Проанализируй статью и верни JSON строго с полями:
  {{
    "summary": "краткое резюме на русском, 2-3 предложений(около 150 слов), без кода и маркдауна",
    "verified": "исправленный вариант резюме (без ошибок, с профессиональной лексикой)",
    "highlighted": "то же резюме, но с HTML-тегами <b> для компаний, дат, чисел",
    "category": "одна из: Биометрия, Компьютерное зрение, Видеоаналитика, DeepFake, Законодательство, Безопасность, Цифровое ID, Рынок, Другое",
    "significance": "число от 0 до 9"
  }}
  Не добавляй ничего кроме JSON. Убедись что текст полностью на русском языке, и что структура json соблюдена.
  Текст статьи: {text}

digest_prompt: |
  Составь дайджест новостей за последнюю неделю строго по следующему формату.
  Каждый блок новости должен выглядеть так:

  ## [Заголовок](ссылка)
  • <тезис>
  • <тезис>
  • <тезис>
  • <тезис>
  • <тезис>

  ---

  Используй только этот формат. Никаких категорий, никаких "источников" отдельно — только заголовок, ссылка и основные тезисы.
  Не добавляй лишнего текста, не меняй структуру.
  Всего новостей должно быть 10 штук, возьми самые значимые
  Вот данные для дайджеста (каждый блок содержит заголовок, ссылку и текст):

  {summaries}

verify_prompt: |
  Проверь текст новости. Исправь:
  - некорректные формулировки
  - ошибки терминологии
  - неудачные обороты
  - неясные места
  Сохрани исходный смысл. Используй профессиональную лексику отрасли.
  Не добавляй новые факты.
  Ответ должен быть только текстом на русском языке, без кода.
  Избегай повторений слов.
  Текст: {summary}

highlight_prompt: |
  Отформатируй текст так, чтобы он воспринимался легче.
  Выдели жирным (с помощью HTML-тегов <b> и </b>):
  - названия компаний
  - страны
  - даты
  - числовые значения
  - ключевые кейсы
  Сохрани смысл, стиль и точность изложения. Не меняй факты.
  Ответ должен быть только текстом с HTML-тегами, без кода.
  Не повторяй одни и те же слова.
  Текст: {text}

category_prompt: |
  Ты – эксперт в ИИ, биометрии и компьютерном зрении.
  Определи, к какой категории относится новость.
  Возможные категории: Биометрия, Компьютерное зрение, Видеоаналитика, DeepFake, Законодательство, Безопасность, Цифровое ID, Рынок, Другое.
  Верни только одно название категории.
  Текст: {text}

significance_prompt: |
  Ты анализируешь новости для профессионального дайджеста по биометрии и компьютерному зрению.
  Оцени значимость новости по шкале от 0 до 9, где:
  0-2 – незначительная новость
  3-5 – умеренно полезная
  6-7 – важная
  8-9 – ключевая новость
  Критерии оценки: влияние на рынок или отрасль, наличие конкретных фактов (цифры, компании, продукты, законы), новизна информации, практическая значимость.
  Верни только одно число от 0 до 9.
  Текст: {text}

dedup_prompt: |
  Ты анализируешь список кратких резюме новостей для отраслевого дайджеста.
  Определи, какие новости описывают одно и то же событие.
  Считай дубликатами новости с одинаковым смыслом, даже если формулировки отличаются.
  Не объединяй новости, если они описывают разные события.
  Учитывай компании, даты и контекст.
  Верни список групп дубликатов в виде массивов порядковых номеров (индексов, начиная с 0).
  Пример: [[0, 2], [1, 4]]
  Если дубликатов нет – верни пустой список [].
  Список резюме (каждое на новой строке):
  {summaries}

digest_from_raw_prompt: |
  Ты – профессиональный аналитик новостей в области биометрии, ИИ, компьютерного зрения.
  На основе приведённых ниже источников (посты из Telegram и статьи) составь дайджест за последнюю неделю.
  Отбери 10 самых значимых новостей.
  Для каждой новости укажи:
    - Заголовок (краткий, ёмкий) — в формате Markdown-ссылки: [Заголовок](url)
    - Категорию (Биометрия, Компьютерное зрение, Видеоаналитика, DeepFake, Законодательство, Безопасность, Цифровое ID, Рынок, Другое)
    - Оценку значимости (1–10)
    - 5 ключевых тезисов в виде маркированного списка. Каждый пункт начинай с новой строки, ставь дефис "-" и пробел, затем текст. Перед списком обязательно оставляй пустую строку.
  Формат ответа – Markdown:
  ## [Заголовок](ссылка_на_источник)
  **Категория:** ... | **Значимость:** .../10

  <img src="ссылка_на_картинку" width="300" /> — если есть image, иначе пропускай.

  - тезис 1
  - тезис 2
  - тезис 3
  - тезис 4
  - тезис 5

  ---
  Не добавляй лишних вступлений и выводов. Только дайджест.
  Вот источники (каждый содержит title, text, date, url, image):
  {sources}
